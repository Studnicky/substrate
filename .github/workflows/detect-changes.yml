name: detect-changes

on:
  workflow_call:
    inputs:
      base-sha:
        required: false
        type: string
      head-sha:
        required: false
        type: string
    outputs:
      docs:
        value: ${{ jobs.detect.outputs.docs }}
      docs_assets:
        value: ${{ jobs.detect.outputs.docs_assets }}
      packages:
        value: ${{ jobs.detect.outputs.packages }}
      scripts:
        value: ${{ jobs.detect.outputs.scripts }}
      tests:
        value: ${{ jobs.detect.outputs.tests }}
      source:
        value: ${{ jobs.detect.outputs.source }}
      config:
        value: ${{ jobs.detect.outputs.config }}
      workflows:
        value: ${{ jobs.detect.outputs.workflows }}
      hooks:
        value: ${{ jobs.detect.outputs.hooks }}
      security_config:
        value: ${{ jobs.detect.outputs.security_config }}
      generated_docs:
        value: ${{ jobs.detect.outputs.generated_docs }}
      lockfiles:
        value: ${{ jobs.detect.outputs.lockfiles }}
      release:
        value: ${{ jobs.detect.outputs.release }}
      ci:
        value: ${{ jobs.detect.outputs.ci }}
      audit:
        value: ${{ jobs.detect.outputs.audit }}
      analysis:
        value: ${{ jobs.detect.outputs.analysis }}
      docs_workflow:
        value: ${{ jobs.detect.outputs.docs_workflow }}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      docs_assets: ${{ steps.filter.outputs.docs_assets }}
      packages: ${{ steps.filter.outputs.packages }}
      scripts: ${{ steps.filter.outputs.scripts }}
      tests: ${{ steps.filter.outputs.tests }}
      source: ${{ steps.filter.outputs.source }}
      config: ${{ steps.filter.outputs.config }}
      workflows: ${{ steps.filter.outputs.workflows }}
      hooks: ${{ steps.filter.outputs.hooks }}
      security_config: ${{ steps.filter.outputs.security_config }}
      generated_docs: ${{ steps.filter.outputs.generated_docs }}
      lockfiles: ${{ steps.filter.outputs.lockfiles }}
      release: ${{ steps.filter.outputs.release }}
      ci: ${{ steps.filter.outputs.ci }}
      audit: ${{ steps.filter.outputs.audit }}
      analysis: ${{ steps.filter.outputs.analysis }}
      docs_workflow: ${{ steps.filter.outputs.docs_workflow }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          HEAD_SHA: ${{ inputs.head-sha }}
        run: |
          set -euo pipefail

          # shellcheck source=../../.githooks/lib/changes.sh
          source .githooks/lib/changes.sh
          # shellcheck source=../../.githooks/lib/range.sh
          source .githooks/lib/range.sh

          base="${BASE_SHA:-}"
          head="${HEAD_SHA:-${GITHUB_SHA}}"

          if [ -z "$base" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
              base="${{ github.event.pull_request.base.sha }}"
            else
              base="${{ github.event.before }}"
            fi
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 "$head" | tail -1)"
          fi

          classify_changes "$(normalize_diff_range "$base" "$head")"

          {
            echo "docs=$CHANGED_DOCS"
            echo "docs_assets=$CHANGED_DOCS_ASSETS"
            echo "packages=$CHANGED_PACKAGES"
            echo "scripts=$CHANGED_SCRIPTS"
            echo "tests=$CHANGED_TESTS"
            echo "source=$CHANGED_SOURCE"
            echo "config=$CHANGED_CONFIG"
            echo "workflows=$CHANGED_WORKFLOWS"
            echo "hooks=$CHANGED_HOOKS"
            echo "security_config=$CHANGED_SECURITY_CONFIG"
            echo "generated_docs=$CHANGED_GENERATED_DOCS"
            echo "lockfiles=$CHANGED_LOCKFILES"
            echo "release=$CHANGED_RELEASE"
            echo "ci=$CHANGED_CI"
            echo "audit=$CHANGED_AUDIT"
            echo "analysis=$CHANGED_ANALYSIS"
            echo "docs_workflow=$CHANGED_DOCS_WORKFLOW"
          } >> "$GITHUB_OUTPUT"
