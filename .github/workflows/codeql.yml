name: CodeQL

# Static analysis (CodeQL) for the TypeScript sources. Runs on pushes and PRs to
# main and develop and weekly, surfacing results under the repository's
# Security > Code scanning tab. build-mode "none" is correct for JS/TS — CodeQL
# analyses the sources directly without a compile step.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.analysis == 'true' || github.event_name ==
      'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-node-setup
      - id: probe
        uses: ./.github/actions/gh-api-probe
        with:
          path: repos/${{ github.repository }}/code-scanning/alerts

      - name: Skip when GHAS unavailable
        if: steps.probe.outputs.enabled != 'true'
        run: |
          echo "CodeQL skipped: GitHub Advanced Security is unavailable."
          exit 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

    timeout-minutes: 15

  required:
    name: CodeQL required
    needs: [ detect-changes, analyze ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate CodeQL result
        shell: bash
        run: |
          set -euo pipefail
          for result in '${{ needs.detect-changes.result }}' '${{ needs.analyze.result }}'; do
            case "$result" in
              success|skipped) ;;
              *) echo "CodeQL required: dependency result was $result" >&2; exit 1 ;;
            esac
          done
