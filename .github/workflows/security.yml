name: security

# Weekly full sweep + manual trigger only — PRs are already covered by
# audit.yml's own detect-changes-gated audit job (report-artifact: false).
# This exists to catch a CVE disclosed against an already-merged, unchanged
# dependency between PRs, and to keep a 30-day npm-audit-report artifact
# trail. Running the same pnpm audit a second time on every PR added no
# signal audit.yml didn't already have, so this no longer triggers on
# pull_request.

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  audit:
    name: security audit suite
    uses: ./.github/workflows/security-audit.yml
    with:
      report-artifact: true
