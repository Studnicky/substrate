name: ci-secrets

on:
  pull_request:
  push:
    branches: [ main, develop ]

concurrency:
  group: ci-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check CI secrets manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: bash scripts/policy-suite.sh config-schema
      - run: bash scripts/policy-suite.sh ci-secrets
