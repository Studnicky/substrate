name: changelog-check

on:
  pull_request_target:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

jobs:
  check:
    name: Validate pull request lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./.github/actions/pnpm-node-setup

      - name: Validate branch route and release state
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git fetch --no-tags origin "pull/$PR_NUMBER/head:refs/substrate/pull-request-head"
          if [ "$(git rev-parse --verify refs/substrate/pull-request-head)" != "$HEAD_SHA" ]; then
            echo "::error::Fetched pull request head does not match the event head SHA." >&2
            exit 1
          fi
          bash scripts/policy-suite.sh branch "$HEAD_REF"
          bash scripts/policy-suite.sh release-flow "origin/$BASE_REF" refs/substrate/pull-request-head "$HEAD_REF"
