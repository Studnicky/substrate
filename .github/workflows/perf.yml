name: Performance

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  build:
    name: Build docs
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.docs_workflow == 'true' || github.event_name ==
      'workflow_dispatch'
    uses: ./.github/workflows/node-suite.yml
    with:
      preset: docs-build
      upload-docs-dist: true

  lighthouse:
    name: Lighthouse CI
    needs: [ detect-changes, build ]
    if: needs.detect-changes.outputs.docs_workflow == 'true' || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-node-setup
      - uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist
      - uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            http://localhost:4173/substrate/
            http://localhost:4173/substrate/getting-started
            http://localhost:4173/substrate/packages/
          startServerCommand: pnpm run docs:preview -- --host 127.0.0.1 --port 4173
          uploadArtifacts: true
          temporaryPublicStorage: false
