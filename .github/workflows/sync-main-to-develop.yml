name: Sync main to develop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ develop ]
    types: [ opened, reopened, synchronize, closed ]
  workflow_dispatch:

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  verify-backmerge-source:
    name: Validate canonical backmerge
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'main' && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: develop

      - name: Verify the server merge test result
        shell: bash
        env:
          MERGE_TEST_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "refs/pull/${PR_NUMBER}/merge:refs/substrate/backmerge-merge-test"
          if [ "$(git rev-parse refs/substrate/backmerge-merge-test)" != "$MERGE_TEST_SHA" ]; then
            echo "::error::The server merge test result does not match the pull request event." >&2
            exit 1
          fi
          bash scripts/release-suite.sh verify-backmerge-result origin/main refs/substrate/backmerge-merge-test

  verify-merged-backmerge:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'main' && github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: develop

      - name: Verify the merged back-merge result
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main develop
          bash scripts/release-suite.sh verify-backmerge-result origin/main origin/develop

  sync:
    needs: [ verify-merged-backmerge ]
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && needs.verify-merged-backmerge.result == 'failure'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main

      - name: Check ancestry
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main develop

          if bash scripts/policy-suite.sh sync-ancestry origin/main origin/develop; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
          fi

          . .githooks/lib/sync-check.sh
          echo "behind=$(sync_unreachable_count origin/main origin/develop)" >> "$GITHUB_OUTPUT"

      - name: Report an in-sync branch pair
        if: steps.diff.outputs.in_sync == 'true'
        run: echo "develop already contains main."

      - name: Resolve the back-merge pull request
        id: pr
        if: steps.diff.outputs.in_sync == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PAT is required to create a main-to-develop pull request that triggers required CI."
            exit 1
          fi
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head main --state open --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head main \
              --title "chore: sync main to develop" \
              --body "Merges the current release history from main into develop with a merge commit."
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head main --state open --json number --jq '.[0].number // empty')
          fi

          if [ -z "$number" ]; then
            echo "::error::A main-to-develop pull request could not be resolved."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Merge the back-merge pull request
        if: steps.diff.outputs.in_sync == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --auto; then
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge
