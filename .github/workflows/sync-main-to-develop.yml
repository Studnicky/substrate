name: Sync main to develop

# `main` must stay an ancestor of `develop`, so a release branch can be cut from
# `develop` and still rebase onto `main`. Squash-merging a back-merge breaks that
# — it replaces main's commits with a new one carrying the same content — and the
# breakage only surfaces later, when the next release branch is refused.
#
# This runs on both branches: pushing `main` opens the back-merge, and pushing
# `develop` re-checks it, so a back-merge that landed as a squash is caught
# immediately rather than at the next release.

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Probe for an open sync PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: chore/sync-main-to-develop
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "existing=$existing" >> "$GITHUB_OUTPUT"

      - name: Check ancestry
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main develop

          if bash scripts/policy-suite.sh sync-ancestry origin/main origin/develop; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
          fi

          . .githooks/lib/sync-check.sh
          echo "behind=$(sync_unreachable_count origin/main origin/develop)" >> "$GITHUB_OUTPUT"

      - name: Report an in-sync branch pair
        if: steps.diff.outputs.in_sync == 'true'
        run: echo "develop already has main as an ancestor."

      - name: Publish the sync branch
        if: steps.diff.outputs.in_sync == 'false'
        shell: bash
        env:
          SYNC_BRANCH: chore/sync-main-to-develop
        run: |
          set -euo pipefail
          git push --force origin "origin/main:refs/heads/${SYNC_BRANCH}"

      # GitHub Actions cannot open a pull request unless the repository allows
      # it, and that same setting also lets Actions approve reviews. Rather than
      # depend on it, the branch above is pushed unconditionally and the PR is
      # only attempted; a refusal degrades to a link instead of a broken sync.
      - name: Open the sync pull request
        id: open
        if: steps.diff.outputs.in_sync == 'false' && steps.pr.outputs.existing == ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: chore/sync-main-to-develop
        run: |
          set -euo pipefail
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base develop \
            --head "$SYNC_BRANCH" \
            --title "chore: sync main to develop" \
            --body "Restores \`main\` as an ancestor of \`develop\`.

          **Merge this with a merge commit.** Squashing recreates the divergence it fixes: it replaces main's commits with a new one carrying the same content, so \`main\` stops being an ancestor and the next release branch cut from \`develop\` is refused for being behind."

      - name: Summarise the required action
        if: steps.diff.outputs.in_sync == 'false'
        shell: bash
        env:
          BEHIND: ${{ steps.diff.outputs.behind }}
          EXISTING: ${{ steps.pr.outputs.existing }}
          OPENED: ${{ steps.open.outcome }}
          SYNC_BRANCH: chore/sync-main-to-develop
        run: |
          set -euo pipefail
          {
            echo "## main is not an ancestor of develop"
            echo
            echo "\`main\` holds ${BEHIND} commit(s) that \`develop\` cannot reach. A release branch cut from \`develop\` will be refused for being behind \`main\`."
            echo
            echo "Branch \`${SYNC_BRANCH}\` now points at \`main\`."
            echo
            if [ -n "${EXISTING}" ]; then
              echo "Sync PR #${EXISTING} is already open."
            elif [ "${OPENED}" = "success" ]; then
              echo "A sync PR has been opened."
            else
              echo "A PR could not be opened automatically — this repository does not permit GitHub Actions to create pull requests."
              echo
              echo "Open it here: https://github.com/${GITHUB_REPOSITORY}/compare/develop...${SYNC_BRANCH}?expand=1"
            fi
            echo
            echo "**Merge it with a merge commit.** Squashing recreates the divergence."
          } >> "$GITHUB_STEP_SUMMARY"
