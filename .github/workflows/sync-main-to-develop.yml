name: Sync main to develop

# `main` must stay an ancestor of `develop`: a release branch is cut from
# `develop` and rebased onto `main`, and the pre-push rebase check refuses the
# push unless that ancestry holds. This workflow restores it without a human in
# the loop — it builds the back-merge branch, opens the pull request, and merges
# it as a merge commit.
#
# The merge method is not incidental. Squashing replaces main's commits with a
# new one carrying the same content, so `main` stops being an ancestor and the
# next release branch is refused. Every merge below is `--merge`.
#
# `develop` is protected and admin-enforced, so nothing can push to it directly;
# the pull request is the only route, and the merge has to happen through it.
#
# Runs on both branches: pushing `main` starts the back-merge, and pushing
# `develop` re-checks it, so a sync that landed wrongly is caught at once rather
# than at the next release.

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

env:
  SYNC_BRANCH: chore/sync-main-to-develop

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check ancestry
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main develop

          if bash scripts/policy-suite.sh sync-ancestry origin/main origin/develop; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
          fi

          # shellcheck source=.githooks/lib/sync-check.sh
          . .githooks/lib/sync-check.sh
          echo "behind=$(sync_unreachable_count origin/main origin/develop)" >> "$GITHUB_OUTPUT"

      - name: Report an in-sync branch pair
        if: steps.diff.outputs.in_sync == 'true'
        run: echo "develop already has main as an ancestor."

      # The branch is main plus an empty changeset. Release gates refuse a branch
      # that changes packages without one, and the release commits this carries
      # are already versioned, so the changeset declares no packages.
      - name: Build the back-merge branch
        if: steps.diff.outputs.in_sync == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git switch --force-create "$SYNC_BRANCH" origin/main

          printf -- '---\n---\n\nSyncs the release commits on `main` into `develop`. No package changes.\n' \
            > ".changeset/sync-main-to-develop.md"
          git add .changeset/sync-main-to-develop.md
          git commit -m 'chore: sync main to develop'

          git push --force origin "$SYNC_BRANCH"

      - name: Resolve the sync pull request
        id: pr
        if: steps.diff.outputs.in_sync == 'false'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base develop \
              --head "$SYNC_BRANCH" \
              --title 'chore: sync main to develop' \
              --body 'Restores `main` as an ancestor of `develop` after a release.

          Merged as a merge commit: squashing would replace main'"'"'s commits with a new one carrying the same content, so `main` would stop being an ancestor and the next release branch cut from `develop` would be refused for being behind.'
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Auto-merge lands it once the required checks pass. Where auto-merge is
      # unavailable, an immediate merge is attempted instead; if the checks are
      # still running it fails harmlessly, and the next push to either branch
      # re-enters this step with the same open pull request.
      - name: Merge the sync pull request
        id: merge
        if: steps.diff.outputs.in_sync == 'false' && steps.pr.outputs.number != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --auto --delete-branch; then
            echo "queued auto-merge for #${PR_NUMBER}"
            exit 0
          fi

          echo "auto-merge unavailable; attempting an immediate merge" >&2
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch

      - name: Summarise the outcome
        if: steps.diff.outputs.in_sync == 'false'
        shell: bash
        env:
          BEHIND: ${{ steps.diff.outputs.behind }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Back-merging main into develop"
            echo
            echo "\`main\` holds ${BEHIND} commit(s) that \`develop\` cannot reach."
            echo

            if [ "$PR_OUTCOME" != "success" ] || [ -z "$PR_NUMBER" ]; then
              echo "A pull request could not be opened. This repository does not permit GitHub Actions to create pull requests — enable **Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests**."
              echo
              echo "Branch \`${SYNC_BRANCH}\` is pushed and ready: https://github.com/${GITHUB_REPOSITORY}/compare/develop...${SYNC_BRANCH}?expand=1"
              echo
              echo "Merge it with a **merge commit**."
            elif [ "$MERGE_OUTCOME" = "success" ]; then
              echo "Pull request #${PR_NUMBER} is merging as a merge commit."
            else
              echo "Pull request #${PR_NUMBER} is open but could not be merged automatically. Merge it with a **merge commit**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the back-merge did not land
        if: steps.diff.outputs.in_sync == 'false' && (steps.pr.outcome != 'success' || steps.merge.outcome != 'success')
        run: |
          echo "::error::main is not an ancestor of develop and the back-merge did not complete; see the job summary."
          exit 1
