name: Release

on:
  workflow_run:
    workflows: [ ci ]
    branches: [ main, develop ]
    types: [ completed ]

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.detect.outputs.action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
      - uses: ./.github/actions/pnpm-node-setup
        with:
          install: false
      - id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          TRUSTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRUSTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          action=none
          if [ "$WORKFLOW_RUN_CONCLUSION" != "success" ] || [ "$WORKFLOW_RUN_EVENT" != "push" ]; then
            echo "action=$action" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$TRUSTED_BRANCH" in
            develop|main) ;;
            *)
              echo "action=$action" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          git fetch --no-tags origin "$TRUSTED_BRANCH"
          actual_sha=$(git rev-parse "origin/$TRUSTED_BRANCH")
          if [ "$actual_sha" != "$TRUSTED_SHA" ]; then
            echo "::error::${TRUSTED_BRANCH} advanced after the completed CI run; wait for CI on the current branch tip."
            exit 1
          fi

          git checkout --detach "$actual_sha"

          git fetch origin main --tags
          case "$TRUSTED_BRANCH" in
            develop)
              if ! git merge-base --is-ancestor origin/main HEAD; then
                echo "::error::develop must contain the current main history before release preparation."
                exit 1
              fi

              open_release_count=$(gh pr list \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --state open \
                --json headRefName \
                --jq '[.[] | select(.headRefName | startswith("release/"))] | length')
              if [ "$open_release_count" -gt 0 ]; then
                echo "action=$action" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              if find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' -size +0c -print -quit | grep -q .; then
                action=prepare
              fi
              ;;
            main)
              version=$(node -p "require('./package.json').version")
              tag="v${version}"
              if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
                tag_target=$(git rev-parse "refs/tags/${tag}^{commit}")
                if ! git merge-base --is-ancestor "$tag_target" "$actual_sha"; then
                  echo "::error::${tag} already exists outside the current main history. Release tags are immutable."
                  exit 1
                fi
              else
                action=tag
              fi
              ;;
          esac

          echo "action=$action" >> "$GITHUB_OUTPUT"

  validate:
    needs: [ plan ]
    if: needs.plan.outputs.action == 'prepare'
    uses: ./.github/workflows/node-suite.yml
    with:
      preset: release-validate

  prepare:
    needs: [ plan, validate ]
    if: needs.plan.outputs.action == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require the release automation token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::PAT is required to create a release pull request that triggers required CI."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.PAT }}
      - uses: ./.github/actions/pnpm-node-setup
      - name: Verify the trusted develop revision
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$TRUSTED_SHA" ]; then
            echo "::error::develop advanced after the completed CI run; wait for CI on the current branch tip."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::develop must contain the current main history before release preparation."
            exit 1
          fi
      - name: Install raster tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Apply pending changesets
        shell: bash
        run: |
          set -euo pipefail
          pnpm changeset version
      - name: Synchronize root version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/types/package.json').version")
          npm pkg set version="$version"
          bash scripts/release-suite.sh verify-lockstep "$version"
      - name: Reject an occupied release tag
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          git fetch origin --tags
          if git rev-parse --verify --quiet "refs/tags/v${version}^{commit}" >/dev/null; then
            echo "::error::v${version} already exists. Release tags are immutable; prepare a new version instead."
            exit 1
          fi
      - name: Stamp docs assets and extract release notes
        shell: bash
        run: |
          set -euo pipefail

          tmpdir=$(mktemp -d "${TMPDIR:-/tmp}/substrate-release.XXXXXX")
          trap 'rm -rf "$tmpdir"' EXIT INT TERM

          bash scripts/ci-suite.sh predocs-build >"$tmpdir/predocs.log" 2>&1 &
          predocs_pid=$!

          node scripts/extract-release-notes.mjs >"$tmpdir/release_notes.md" &
          notes_pid=$!

          if ! wait "$predocs_pid"; then
            cat "$tmpdir/predocs.log" >&2
            exit 1
          fi

          if ! wait "$notes_pid"; then
            cat "$tmpdir/release_notes.md" >&2
            exit 1
          fi

          cp "$tmpdir/release_notes.md" release_notes.md
          STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts
      - name: Commit versioned release assets
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Release preparation did not change any tracked files."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          release_branch="release/v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release v${version}"
          echo "branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Push the release branch
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null; then
            echo "::error::${RELEASE_BRANCH} already exists. Release branches are immutable after preparation."
            exit 1
          fi
          git push origin "HEAD:refs/heads/${RELEASE_BRANCH}"
      - name: Open the release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RELEASE_BRANCH: ${{ steps.commit.outputs.branch }}
          VERSION: ${{ steps.commit.outputs.version }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -z "$number" ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "release: v${VERSION}" \
              --body "Contains the versioned release assets for v${VERSION}. Merge with a merge commit after required checks pass. Main CI tags that merge commit and publishes GitHub Packages."
          fi

  tag:
    needs: [ plan ]
    if: needs.plan.outputs.action == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/pnpm-node-setup
        with:
          install: false
      - name: Verify the merged release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          actual_sha=$(git rev-parse HEAD)
          if [ "$actual_sha" != "$TRUSTED_SHA" ]; then
            echo "::error::main advanced after the completed CI run; wait for CI on the current main commit."
            exit 1
          fi

          parent_count=$(git rev-list --parents -n 1 "$actual_sha" | awk '{ print NF - 1 }')
          if [ "$parent_count" -ne 2 ]; then
            echo "::error::A release must be merged into main with a merge commit."
            exit 1
          fi

          release_pr=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${actual_sha}/pulls" \
            | jq -r --arg sha "$actual_sha" '
              [ .[]
                | select(.merged_at != null)
                | select(.base.ref == "main")
                | select(.head.ref | test("^(release/|hotfix/)"))
                | select(.merge_commit_sha == $sha)
              ]
              | if length == 1 then .[0] | [.number, .head.sha] | @tsv else empty end
            ')

          if [ -z "$release_pr" ]; then
            echo "::error::main must be the merge commit of one main-targeting release/* or hotfix/* pull request."
            exit 1
          fi

          IFS=$'\t' read -r pr_number pr_head_sha <<< "$release_pr"
          if [ "$(git rev-parse "${actual_sha}^2")" != "$pr_head_sha" ]; then
            echo "::error::Pull request #${pr_number} does not terminate at the merged source revision."
            exit 1
          fi

          version=$(node -p "require('./package.json').version")
          bash scripts/release-suite.sh publish-gates "$version"
          if git rev-parse --verify --quiet "refs/tags/v${version}^{commit}" >/dev/null; then
            echo "::error::v${version} already exists. Release tags are immutable."
            exit 1
          fi
      - name: Tag the merged release
        shell: bash
        env:
          TRUSTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${version}" "$TRUSTED_SHA" -m "Release v${version}"
          git push origin "refs/tags/v${version}"
      - name: Dispatch the GitHub Packages workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "v${version}"
