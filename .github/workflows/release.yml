name: Release

on:
  workflow_run:
    workflows: [ ci ]
    branches: [ main ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      publish:
        description: Create the release tag after versioning and validation
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_needed: ${{ steps.detect.outputs.release_needed }}
      publish: ${{ steps.detect.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          ACTOR: ${{ github.actor }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          release_needed=false
          if [ -d .changeset ] && find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | grep -q .; then
            release_needed=true
          fi

          publish=false
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$WORKFLOW_RUN_CONCLUSION" = "success" ] &&
               [ "$WORKFLOW_RUN_EVENT" = "push" ] &&
               [ "$ACTOR" != "github-actions[bot]" ]; then
              publish=true
            fi
          elif [ "$INPUT_PUBLISH" = "true" ]; then
            publish=true
            release_needed=true
          fi

          echo "release_needed=$release_needed" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  validate:
    needs: [ plan ]
    if: needs.plan.outputs.release_needed == 'true' && needs.plan.outputs.publish ==
      'true'
    uses: ./.github/workflows/node-suite.yml
    with:
      preset: release-validate

  release:
    needs: [ plan, validate ]
    if: needs.plan.outputs.release_needed == 'true' && needs.plan.outputs.publish ==
      'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/pnpm-node-setup
      - name: Install raster tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - run: pnpm changeset version
      - name: Stamp docs assets and extract release notes
        shell: bash
        run: |
          set -euo pipefail

          tmpdir=$(mktemp -d "${TMPDIR:-/tmp}/substrate-release.XXXXXX")
          trap 'rm -rf "$tmpdir"' EXIT INT TERM

          bash scripts/ci-suite.sh predocs-build >"$tmpdir/predocs.log" 2>&1 &
          predocs_pid=$!

          node scripts/extract-release-notes.mjs >"$tmpdir/release_notes.md" &
          notes_pid=$!

          if ! wait "$predocs_pid"; then
            cat "$tmpdir/predocs.log" >&2
            exit 1
          fi

          if ! wait "$notes_pid"; then
            cat "$tmpdir/release_notes.md" >&2
            exit 1
          fi

          cp "$tmpdir/release_notes.md" release_notes.md
          STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts
      - name: Commit versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Release stamping did not change any tracked files."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release v${version}"
      - name: Tag release
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          git tag -a "v${version}" -m "Release v${version}"
      - name: Push release commit and tag
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
        run: git push origin HEAD:main --tags
      - name: Dispatch publish workflow when using GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.PAT != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_PAT" = "true" ]; then
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          gh workflow run publish.yml --ref "v${version}"
