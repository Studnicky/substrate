name: node-suite

on:
  workflow_call:
    inputs:
      preset:
        required: false
        type: string
        default: ''
      run-stamp-version-check:
        required: false
        type: boolean
        default: false
      run-typecheck:
        required: false
        type: boolean
        default: false
      run-lint:
        required: false
        type: boolean
        default: false
      run-test:
        required: false
        type: boolean
        default: false
      run-test-unit:
        required: false
        type: boolean
        default: false
      run-test-integration:
        required: false
        type: boolean
        default: false
      run-test-smoke:
        required: false
        type: boolean
        default: false
      run-test-all:
        required: false
        type: boolean
        default: false
      run-build:
        required: false
        type: boolean
        default: false
      run-docs-build:
        required: false
        type: boolean
        default: false
      run-predocs-build:
        required: false
        type: boolean
        default: false
      run-audit:
        required: false
        type: boolean
        default: false
      verify-dist:
        required: false
        type: boolean
        default: false
      upload-docs-dist:
        required: false
        type: boolean
        default: false
      docs-dist-artifact:
        required: false
        type: string
        default: docs-dist

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          preset='${{ inputs.preset }}'
          entries=
          append_entry() {
            entry="$1"
            if [ -n "$entries" ]; then
              entries="${entries},"
            fi
            entries="${entries}${entry}"
          }

          case "$preset" in
            full)
              append_entry '{"name":"generated-artifacts","command":"STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts","install_rsvg":"true"}'
              append_entry '{"name":"typecheck","command":"bash scripts/ci-suite.sh typecheck"}'
              append_entry '{"name":"lint","command":"bash scripts/ci-suite.sh lint"}'
              append_entry '{"name":"test-unit","command":"bash scripts/ci-suite.sh test-unit"}'
              append_entry '{"name":"test-integration","command":"bash scripts/ci-suite.sh test-integration"}'
              append_entry '{"name":"test-smoke","command":"bash scripts/ci-suite.sh test-smoke"}'
              append_entry '{"name":"build","command":"bash scripts/ci-suite.sh build"}'
              ;;
            audit)
              append_entry '{"name":"audit","command":"bash scripts/ci-suite.sh audit"}'
              ;;
            release-validate|publish-validate)
              append_entry '{"name":"generated-artifacts","command":"STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts","install_rsvg":"true"}'
              append_entry '{"name":"typecheck","command":"bash scripts/ci-suite.sh typecheck"}'
              append_entry '{"name":"lint","command":"bash scripts/ci-suite.sh lint"}'
              append_entry '{"name":"test-unit","command":"bash scripts/ci-suite.sh test-unit"}'
              append_entry '{"name":"test-integration","command":"bash scripts/ci-suite.sh test-integration"}'
              append_entry '{"name":"test-smoke","command":"bash scripts/ci-suite.sh test-smoke"}'
              append_entry '{"name":"build","command":"bash scripts/ci-suite.sh build"}'
              append_entry '{"name":"audit","command":"bash scripts/ci-suite.sh audit"}'
              append_entry '{"name":"predocs-build","command":"bash scripts/ci-suite.sh predocs-build"}'
              ;;
            docs)
              append_entry '{"name":"generated-artifacts","command":"STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts","install_rsvg":"true"}'
              append_entry '{"name":"docs-includes","command":"bash scripts/ci-suite.sh docs-includes"}'
              append_entry '{"name":"docs-build","command":"bash scripts/ci-suite.sh docs-build","upload_docs":"false"}'
              ;;
            docs-build)
              append_entry '{"name":"generated-artifacts","command":"STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts","install_rsvg":"true"}'
              append_entry '{"name":"docs-includes","command":"bash scripts/ci-suite.sh docs-includes"}'
              append_entry '{"name":"docs-build","command":"bash scripts/ci-suite.sh docs-build","upload_docs":"true"}'
              ;;
            '')
              if [ '${{ inputs.run-stamp-version-check }}' = 'true' ]; then
                append_entry '{"name":"stamp-version-check","command":"bash scripts/ci-suite.sh stamp-version-check"}'
              fi
              if [ '${{ inputs.run-typecheck }}' = 'true' ]; then
                append_entry '{"name":"typecheck","command":"bash scripts/ci-suite.sh typecheck"}'
              fi
              if [ '${{ inputs.run-lint }}' = 'true' ]; then
                append_entry '{"name":"lint","command":"bash scripts/ci-suite.sh lint"}'
              fi
              if [ '${{ inputs.run-test }}' = 'true' ]; then
                append_entry '{"name":"test-unit","command":"bash scripts/ci-suite.sh test-unit"}'
              fi
              if [ '${{ inputs.run-test-unit }}' = 'true' ]; then
                append_entry '{"name":"test-unit","command":"bash scripts/ci-suite.sh test-unit"}'
              fi
              if [ '${{ inputs.run-test-integration }}' = 'true' ]; then
                append_entry '{"name":"test-integration","command":"bash scripts/ci-suite.sh test-integration"}'
              fi
              if [ '${{ inputs.run-test-smoke }}' = 'true' ]; then
                append_entry '{"name":"test-smoke","command":"bash scripts/ci-suite.sh test-smoke"}'
              fi
              if [ '${{ inputs.run-test-all }}' = 'true' ]; then
                append_entry '{"name":"test-all","command":"bash scripts/ci-suite.sh test-all"}'
              fi
              if [ '${{ inputs.run-build }}' = 'true' ]; then
                append_entry '{"name":"build","command":"bash scripts/ci-suite.sh build"}'
              fi
              if [ '${{ inputs.run-docs-build }}' = 'true' ]; then
                append_entry '{"name":"docs-build","command":"bash scripts/ci-suite.sh docs-build","upload_docs":"${{ inputs.upload-docs-dist }}"}'
              fi
              if [ '${{ inputs.run-predocs-build }}' = 'true' ]; then
                append_entry '{"name":"predocs-build","command":"bash scripts/ci-suite.sh predocs-build"}'
              fi
              if [ '${{ inputs.run-audit }}' = 'true' ]; then
                append_entry '{"name":"audit","command":"bash scripts/ci-suite.sh audit"}'
              fi
              if [ '${{ inputs.verify-dist }}' = 'true' ]; then
                append_entry '{"name":"verify-dist","command":"bash scripts/ci-suite.sh verify-dist"}'
              fi
              ;;
            *)
              echo "node-suite: unknown preset '$preset'" >&2
              exit 1
              ;;
          esac

          echo "matrix={\"include\":[${entries:-}]}" >> "$GITHUB_OUTPUT"

  suite:
    needs: [ plan ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/pnpm-node-setup
      - if: matrix.install_rsvg == 'true'
        name: Install raster tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
      - if: matrix.upload_docs == 'true' && inputs.upload-docs-dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.docs-dist-artifact }}
          path: docs/.vitepress/dist
      - if: matrix.name == 'verify-dist'
        run: bash scripts/ci-suite.sh verify-dist
