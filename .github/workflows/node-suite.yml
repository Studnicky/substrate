name: node-suite

on:
  workflow_call:
    inputs:
      preset:
        required: false
        type: string
        default: ''
      run-stamp-version-check:
        required: false
        type: boolean
        default: false
      run-typecheck:
        required: false
        type: boolean
        default: false
      run-lint:
        required: false
        type: boolean
        default: false
      run-test:
        required: false
        type: boolean
        default: false
      run-test-unit:
        required: false
        type: boolean
        default: false
      run-test-integration:
        required: false
        type: boolean
        default: false
      run-test-smoke:
        required: false
        type: boolean
        default: false
      run-test-all:
        required: false
        type: boolean
        default: false
      run-build:
        required: false
        type: boolean
        default: false
      run-docs-build:
        required: false
        type: boolean
        default: false
      run-predocs-build:
        required: false
        type: boolean
        default: false
      run-audit:
        required: false
        type: boolean
        default: false
      verify-dist:
        required: false
        type: boolean
        default: false
      upload-docs-dist:
        required: false
        type: boolean
        default: false
      docs-dist-artifact:
        required: false
        type: string
        default: docs-dist

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - id: resolve
        shell: bash
        env:
          AUDIT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}',
            github.base_ref) || '' }}
          INPUT_PRESET: ${{ inputs.preset }}
          RUN_AUDIT: ${{ inputs.run-audit }}
          RUN_BUILD: ${{ inputs.run-build }}
          RUN_DOCS_BUILD: ${{ inputs.run-docs-build }}
          RUN_LINT: ${{ inputs.run-lint }}
          RUN_PREDOCS_BUILD: ${{ inputs.run-predocs-build }}
          RUN_STAMP_VERSION_CHECK: ${{ inputs.run-stamp-version-check }}
          RUN_TEST: ${{ inputs.run-test }}
          RUN_TEST_ALL: ${{ inputs.run-test-all }}
          RUN_TEST_INTEGRATION: ${{ inputs.run-test-integration }}
          RUN_TEST_SMOKE: ${{ inputs.run-test-smoke }}
          RUN_TEST_UNIT: ${{ inputs.run-test-unit }}
          RUN_TYPECHECK: ${{ inputs.run-typecheck }}
          UPLOAD_DOCS_DIST: ${{ inputs.upload-docs-dist }}
          VERIFY_DIST: ${{ inputs.verify-dist }}
        run: |
          set -euo pipefail

          preset="$INPUT_PRESET"
          entries=
          append_entry() {
            entry="$1"
            if [ -n "$entries" ]; then
              entries="${entries},"
            fi
            entries="${entries}${entry}"
          }

          case "$preset" in
            full)
              append_entry '{"name":"generated-artifacts","command":"STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts","install_rsvg":"true"}'
              append_entry '{"name":"typecheck","command":"bash scripts/ci-suite.sh typecheck"}'
              append_entry '{"name":"lint","command":"bash scripts/ci-suite.sh lint"}'
              append_entry '{"name":"test-unit","command":"bash scripts/ci-suite.sh test-unit"}'
              append_entry '{"name":"test-integration","command":"bash scripts/ci-suite.sh test-integration"}'
              append_entry '{"name":"test-smoke","command":"bash scripts/ci-suite.sh test-smoke"}'
              append_entry '{"name":"build","command":"bash scripts/ci-suite.sh build"}'
              ;;
            audit)
              append_entry "{\"name\":\"audit\",\"command\":\"CI_SUITE_BASE_REF=${AUDIT_BASE_REF} bash scripts/ci-suite.sh audit\"}"
              ;;
            release-validate|publish-validate)
              append_entry '{"name":"generated-artifacts","command":"STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts","install_rsvg":"true"}'
              append_entry '{"name":"typecheck","command":"bash scripts/ci-suite.sh typecheck"}'
              append_entry '{"name":"lint","command":"bash scripts/ci-suite.sh lint"}'
              append_entry '{"name":"test-unit","command":"bash scripts/ci-suite.sh test-unit"}'
              append_entry '{"name":"test-integration","command":"bash scripts/ci-suite.sh test-integration"}'
              append_entry '{"name":"test-smoke","command":"bash scripts/ci-suite.sh test-smoke"}'
              append_entry '{"name":"build","command":"bash scripts/ci-suite.sh build"}'
              append_entry "{\"name\":\"audit\",\"command\":\"CI_SUITE_BASE_REF=${AUDIT_BASE_REF} bash scripts/ci-suite.sh audit\"}"
              append_entry '{"name":"predocs-build","command":"bash scripts/ci-suite.sh predocs-build"}'
              ;;
            docs)
              append_entry '{"name":"generated-artifacts","command":"STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts","install_rsvg":"true"}'
              append_entry '{"name":"docs-includes","command":"bash scripts/ci-suite.sh docs-includes"}'
              append_entry '{"name":"docs-build","command":"bash scripts/ci-suite.sh docs-build","upload_docs":"false"}'
              ;;
            docs-build)
              append_entry '{"name":"generated-artifacts","command":"STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh generated-artifacts","install_rsvg":"true"}'
              append_entry '{"name":"docs-includes","command":"bash scripts/ci-suite.sh docs-includes"}'
              append_entry '{"name":"docs-build","command":"bash scripts/ci-suite.sh docs-build","upload_docs":"true"}'
              ;;
            '')
              if [ "$RUN_STAMP_VERSION_CHECK" = 'true' ]; then
                append_entry '{"name":"stamp-version-check","command":"bash scripts/ci-suite.sh stamp-version-check"}'
              fi
              if [ "$RUN_TYPECHECK" = 'true' ]; then
                append_entry '{"name":"typecheck","command":"bash scripts/ci-suite.sh typecheck"}'
              fi
              if [ "$RUN_LINT" = 'true' ]; then
                append_entry '{"name":"lint","command":"bash scripts/ci-suite.sh lint"}'
              fi
              if [ "$RUN_TEST" = 'true' ]; then
                append_entry '{"name":"test-unit","command":"bash scripts/ci-suite.sh test-unit"}'
              fi
              if [ "$RUN_TEST_UNIT" = 'true' ]; then
                append_entry '{"name":"test-unit","command":"bash scripts/ci-suite.sh test-unit"}'
              fi
              if [ "$RUN_TEST_INTEGRATION" = 'true' ]; then
                append_entry '{"name":"test-integration","command":"bash scripts/ci-suite.sh test-integration"}'
              fi
              if [ "$RUN_TEST_SMOKE" = 'true' ]; then
                append_entry '{"name":"test-smoke","command":"bash scripts/ci-suite.sh test-smoke"}'
              fi
              if [ "$RUN_TEST_ALL" = 'true' ]; then
                append_entry '{"name":"test-all","command":"bash scripts/ci-suite.sh test-all"}'
              fi
              if [ "$RUN_BUILD" = 'true' ]; then
                append_entry '{"name":"build","command":"bash scripts/ci-suite.sh build"}'
              fi
              if [ "$RUN_DOCS_BUILD" = 'true' ]; then
                docs_upload=false
                if [ "$UPLOAD_DOCS_DIST" = 'true' ]; then
                  docs_upload=true
                fi
                append_entry "{\"name\":\"docs-build\",\"command\":\"bash scripts/ci-suite.sh docs-build\",\"upload_docs\":\"${docs_upload}\"}"
              fi
              if [ "$RUN_PREDOCS_BUILD" = 'true' ]; then
                append_entry '{"name":"predocs-build","command":"bash scripts/ci-suite.sh predocs-build"}'
              fi
              if [ "$RUN_AUDIT" = 'true' ]; then
                append_entry '{"name":"audit","command":"bash scripts/ci-suite.sh audit"}'
              fi
              if [ "$VERIFY_DIST" = 'true' ]; then
                append_entry '{"name":"verify-dist","command":"bash scripts/ci-suite.sh verify-dist"}'
              fi
              ;;
            *)
              echo "node-suite: unknown preset '$preset'" >&2
              exit 1
              ;;
          esac

          echo "matrix={\"include\":[${entries:-}]}" >> "$GITHUB_OUTPUT"

  suite:
    needs: [ plan ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/pnpm-node-setup
      # `full`/`release-validate`/`publish-validate` fan typecheck/lint/test-*/build
      # out into separate parallel jobs, each independently satisfying its own
      # `prepare_dist` (tsc -b) if dist/ isn't already present — an exact-key
      # cache here lets a job with unchanged package sources skip that rebuild
      # entirely instead of paying for it once per matrix entry. Exact-key only
      # (no restore-keys fallback): `prepare_dist` trusts dist/index.js's mere
      # presence as "done", so a partial/stale restore would silently skip a
      # build that should have happened.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/*/dist
            packages/*/tsconfig.tsbuildinfo
            packages/*/tsconfig.tests.tsbuildinfo
          key: ${{ runner.os }}-dist-${{ hashFiles('packages/*/src/**', 'packages/*/package.json',
            'packages/*/tsconfig*.json', 'tsconfig.json', 'pnpm-lock.yaml') }}
      - if: matrix.install_rsvg == 'true'
        name: Install raster tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
      - name: Run ${{ matrix.name }}
        env:
          MATRIX_COMMAND: ${{ matrix.command }}
        run: bash -euo pipefail -c "$MATRIX_COMMAND"
      - if: matrix.upload_docs == 'true' && inputs.upload-docs-dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.docs-dist-artifact }}
          path: docs/.vitepress/dist
      - if: matrix.name == 'verify-dist'
        run: bash scripts/ci-suite.sh verify-dist
