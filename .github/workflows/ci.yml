name: ci

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  validate:
    name: node checks
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.ci == 'true' || github.event_name ==
      'workflow_dispatch'
    uses: ./.github/workflows/node-suite.yml
    with:
      preset: full

  docs:
    name: docs and generated artifacts
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.docs_workflow == 'true' || github.event_name ==
      'workflow_dispatch'
    uses: ./.github/workflows/node-suite.yml
    with:
      preset: docs

  audit:
    name: audit
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.audit == 'true' || github.event_name ==
      'workflow_dispatch'
    uses: ./.github/workflows/node-suite.yml
    with:
      preset: audit

  ci-gate:
    name: ci-gate
    needs: [ detect-changes, validate, docs, audit ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate CI result
        shell: bash
        run: |
          set -euo pipefail
          for result in '${{ needs.detect-changes.result }}' '${{ needs.validate.result }}' '${{ needs.docs.result }}' '${{ needs.audit.result }}'; do
            case "$result" in
              success|skipped) ;;
              *) echo "ci-gate: dependency result was $result" >&2; exit 1 ;;
            esac
          done
