name: Publish Packages

# Publishes all 27 @studnicky/* workspace packages to GitHub Packages when a
# semver tag (v*) is pushed. Nothing publishes on merge to main — tags are the
# only trigger. workflow_dispatch allows a manual dry-run against the tag-less
# path (validate + publish guard via NPM_PUBLISH_ENABLED).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── validate ────────────────────────────────────────────────────────────────
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/pnpm-node-setup

      - name: Release gates
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$expected_version" ]]; then
              echo "::error::Tag version (${tag_version}) does not match root package.json version (${expected_version})"
              exit 1
            fi
          fi
          bash scripts/release-suite.sh publish-gates "$expected_version"

  validate:
    name: Validate
    uses: ./.github/workflows/node-suite.yml
    with:
      preset: publish-validate

  # ─── publish ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish to GitHub Packages
    needs: [ gates, validate ]
    # Defense-in-depth: a tag push still no-ops until the repo variable is set true.
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish-packages.outputs.published }}
      version: ${{ steps.capture-version.outputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/pnpm-node-setup
      - name: Install raster tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Capture version
        id: capture-version
        shell: bash
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d "${TMPDIR:-/tmp}/substrate-publish.XXXXXX")
          trap 'rm -rf "$tmpdir"' EXIT INT TERM

          STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh build predocs-build generated-artifacts >"$tmpdir/build.log" 2>&1 &
          build_pid=$!

          node -p "require('./package.json').version" >"$tmpdir/version.txt"

          if ! wait "$build_pid"; then
            cat "$tmpdir/build.log" >&2
            exit 1
          fi

          echo "version=$(cat "$tmpdir/version.txt")" >> "$GITHUB_OUTPUT"

      # pnpm -r publish is idempotent: it skips packages whose current version is
      # already on the registry, so no manual npm-view loop is required here.
      - name: Publish all packages
        id: publish-packages
        run: |
          pnpm -r publish --provenance --no-git-checks --access public
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── release ─────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/pnpm-node-setup
        with:
          install: false

      - name: Extract changelog notes
        run: node scripts/extract-release-notes.mjs > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md \
            --verify-tag=false
