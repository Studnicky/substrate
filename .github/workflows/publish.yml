name: Publish Packages

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: ./.github/actions/pnpm-node-setup

      - name: Verify the immutable release tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          case "$REF_TYPE:$TAG" in
            tag:v*) ;;
            *)
              echo "::error::Publishing requires an immutable v* tag reference."
              exit 1
              ;;
          esac

          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "::error::${TAG} must be an annotated release tag."
            exit 1
          fi

          remote_tag=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{ print $1 }')
          local_tag=$(git rev-parse "refs/tags/${TAG}")
          if [ "$remote_tag" != "$local_tag" ]; then
            echo "::error::${TAG} does not match the immutable remote tag object."
            exit 1
          fi

          tag_target=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if [ "$(git rev-parse HEAD)" != "$tag_target" ]; then
            echo "::error::Checkout does not resolve to ${TAG}'s commit."
            exit 1
          fi

      - name: Release gates
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v${expected_version}" ]; then
            echo "::error::Tag version (${TAG#v}) does not match root package.json version (${expected_version})."
            exit 1
          fi
          bash scripts/release-suite.sh publish-gates "$expected_version"

  validate:
    name: Validate
    uses: ./.github/workflows/node-suite.yml
    with:
      preset: publish-validate

  publish:
    name: Publish to GitHub Packages
    needs: [ gates, validate ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish-packages.outputs.published }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/pnpm-node-setup
      - name: Install raster tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Build publish artifacts
        shell: bash
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d "${TMPDIR:-/tmp}/substrate-publish.XXXXXX")
          trap 'rm -rf "$tmpdir"' EXIT INT TERM

          STAMP_VERSION_REQUIRE_RASTER=true bash scripts/ci-suite.sh build predocs-build generated-artifacts >"$tmpdir/build.log" 2>&1 &
          build_pid=$!

          if ! wait "$build_pid"; then
            cat "$tmpdir/build.log" >&2
            exit 1
          fi

      - name: Publish all packages
        id: publish-packages
        run: |
          pnpm -r publish --provenance --no-git-checks --access public
          echo "published=true" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
      - uses: ./.github/actions/pnpm-node-setup
        with:
          install: false

      - name: Extract changelog notes
        run: node scripts/extract-release-notes.mjs > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release_notes.md
