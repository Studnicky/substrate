name: security-audit

on:
  workflow_call:
    inputs:
      report-artifact:
        required: false
        type: boolean
        default: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/pnpm-node-setup
      - name: Run audit checks
        shell: bash
        env:
          AUDIT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}',
            github.base_ref) || '' }}
          REPORT_ARTIFACT: ${{ inputs.report-artifact }}
        run: |
          set -euo pipefail

          tmpdir=$(mktemp -d "${TMPDIR:-/tmp}/substrate-security-audit.XXXXXX")
          trap 'rm -rf "$tmpdir"' EXIT INT TERM

          if [ "$REPORT_ARTIFACT" = "true" ]; then
            pnpm audit --json >"$tmpdir/npm-audit-report.json" 2>"$tmpdir/report.log" || true &
            report_pid=$!
          fi

          bash scripts/security-suite.sh audit "$AUDIT_BASE_REF" >"$tmpdir/audit.log" 2>&1 &
          audit_pid=$!

          if ! wait "$audit_pid"; then
            cat "$tmpdir/audit.log" >&2
            exit 1
          fi

          if [ "$REPORT_ARTIFACT" = "true" ]; then
            wait "$report_pid" || true
            cp "$tmpdir/npm-audit-report.json" npm-audit-report.json
          fi
      - if: inputs.report-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30
