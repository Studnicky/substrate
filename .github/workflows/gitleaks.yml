name: gitleaks

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: diff
        uses: ./.github/actions/diff-range
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.21.2"
          archive="/tmp/gitleaks.tar.gz"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            -o "$archive"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $archive" | sha256sum --check
          sudo tar -xz -C /usr/local/bin -f "$archive" gitleaks
      - run: bash scripts/security-suite.sh gitleaks-range "$DIFF_RANGE"
        env:
          DIFF_RANGE: ${{ steps.diff.outputs.range }}
          SECURITY_SUITE_REQUIRE_TOOLS: 'true'
