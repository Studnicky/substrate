name: license-check

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  check:
    name: license report
    needs: [ detect-changes ]
    if: needs.detect-changes.outputs.lockfiles == 'true' || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/pnpm-node-setup
        with:
          install-args: --prod --frozen-lockfile
      - name: Generate license report
        shell: bash
        run: |
          set -euo pipefail
          if npx license-report --csv | tee license-report.csv | grep -Eq "AGPL|GPL|SSPL"; then
            echo "ERROR: Disallowed license detected (AGPL, GPL, or SSPL)."
            echo "Review the license-report.csv artifact for details."
            exit 1
          fi
      - name: Check for disallowed licenses
        run: echo "License check passed — no disallowed licenses found."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: license-report
          path: license-report.csv
          retention-days: 30

  required:
    name: License compliance
    needs: [ detect-changes, check ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate license compliance result
        shell: bash
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          set -euo pipefail
          for result in "$DETECT_CHANGES_RESULT" "$CHECK_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "License compliance: dependency result was $result" >&2; exit 1 ;;
            esac
          done
