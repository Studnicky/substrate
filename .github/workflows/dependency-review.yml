name: dependency-review

on:
  pull_request:
    branches: [ develop, main ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: diff
        uses: ./.github/actions/diff-range
      - id: probe
        uses: ./.github/actions/gh-api-probe
        with:
          path: repos/${{ github.repository }}/dependency-graph/compare/${{
            steps.diff.outputs.base_sha }}...${{ steps.diff.outputs.head_sha }}

      - name: Skip when dependency graph unavailable
        if: steps.probe.outputs.enabled != 'true'
        run: |
          echo "Dependency review skipped: dependency graph is unavailable."
          exit 0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
