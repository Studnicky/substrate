name: pnpm-node-setup
description: Setup Node, pnpm, and install dependencies with the shared
  registry/cache settings.

inputs:
  node-version:
    required: false
    default: '24'
  pnpm-version:
    required: false
    default: '10.32.1'
  scope:
    required: false
    default: '@studnicky'
  install:
    required: false
    default: 'true'
  install-args:
    required: false
    default: '--frozen-lockfile'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      with:
        version: ${{ inputs.pnpm-version }}
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: 'https://npm.pkg.github.com'
        scope: ${{ inputs.scope }}
    # setup-node's registry-url writes a global .npmrc expecting NODE_AUTH_TOKEN
    # as a job-wide env var, not a single step's — without this, every later
    # pnpm invocation in the job re-warns about the unresolved placeholder.
    - shell: bash
      run: echo "NODE_AUTH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
    # actions/setup-node's cache: pnpm only caches the pnpm content-addressable
    # store (avoids re-downloading packages) — pnpm still re-resolves and
    # re-links the full dependency graph into node_modules on every job. This
    # caches the already-linked node_modules trees themselves, keyed on the
    # lockfile, and skips `pnpm install` outright on an exact hit.
    - if: inputs.install == 'true'
      id: node-modules-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-node-modules-${{ inputs.install-args }}-${{ hashFiles('pnpm-lock.yaml') }}
    - if: inputs.install == 'true' && steps.node-modules-cache.outputs.cache-hit
        != 'true'
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: |
        case "$INSTALL_ARGS" in
          "--frozen-lockfile")
            pnpm install --frozen-lockfile
            ;;
          "--prod --frozen-lockfile")
            pnpm install --prod --frozen-lockfile
            ;;
          "--no-frozen-lockfile")
            pnpm install --no-frozen-lockfile
            ;;
          *)
            echo "pnpm-node-setup: unsupported install args '$INSTALL_ARGS'" >&2
            exit 1
            ;;
        esac
