name: resolve-pull-request-head
description: Fetch and verify an immutable pull request head for policy inspection.

inputs:
  base-ref:
    required: true
  pull-request-number:
    required: true
  expected-head-sha:
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        EXPECTED_HEAD_SHA: ${{ inputs.expected-head-sha }}
      run: |
        set -euo pipefail

        case "$PR_NUMBER" in
          ''|*[!0-9]*)
            echo "resolve-pull-request-head: pull request number must be numeric." >&2
            exit 1
            ;;
        esac

        if [[ ! "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "resolve-pull-request-head: expected head SHA must be a full Git object ID." >&2
          exit 1
        fi

        git fetch --no-tags origin "$BASE_REF"
        git fetch --no-tags origin "pull/$PR_NUMBER/head:refs/substrate/pull-request-head"

        if [ "$(git rev-parse --verify refs/substrate/pull-request-head)" != "$EXPECTED_HEAD_SHA" ]; then
          echo "::error::Fetched pull request head does not match the event head SHA." >&2
          exit 1
        fi
